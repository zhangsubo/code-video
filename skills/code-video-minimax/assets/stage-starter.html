<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
  <title>Code-Rendered Video Stage Starter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 110px 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hero-card {
      padding: 64px 72px;
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.24);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
    }
    .kicker {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      font-size: 20px;
      font-weight: 600;
      white-space: nowrap;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 72px;
      line-height: 1.16;
      letter-spacing: -0.025em;
      font-weight: 800;
      margin-bottom: 28px;
    }
    .metric {
      font-size: 64px;
      font-weight: 800;
      color: #34d399;
      font-variant-numeric: tabular-nums;
    }
    /* Interactive preview bar (auto-hidden during headless ?render=1) */
    body.render-mode #scrubber { display: none !important; }
    #scrubber {
      position: fixed;
      left: 32px;
      right: 32px;
      bottom: 20px;
      height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 9999;
    }
    #scrubber input { flex: 1; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="hero-card" id="card">
      <div class="kicker">DETERMINISTIC CODE STAGE · 1080P 60FPS</div>
      <h1 id="headline">用纯时间函数拍出商业级产品大片</h1>
      <div class="metric" id="counter">0.0s</div>
    </div>
  </div>

  <div id="scrubber">
    <button id="play-btn">Play</button>
    <input id="range" type="range" min="0" max="24" step="0.016" value="0" />
    <span id="time-label" style="font-variant-numeric: tabular-nums;">0.00s</span>
  </div>

  <script>
    (function () {
      const DURATION = 24.0;
      if (new URLSearchParams(location.search).get("render") === "1") {
        document.body.classList.add("render-mode");
      }

      // Closed-form 2nd-order damped spring (zeta = 0.84 -> ~0.8% micro-overshoot)
      function spring(dt, zeta, omega) {
        if (dt <= 0) return 0;
        const z = zeta !== undefined ? zeta : 0.84;
        const w = omega !== undefined ? omega : 14.0;
        if (dt > 2.5) return 1;
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
      }

      const card = document.getElementById("card");
      const counter = document.getElementById("counter");

      // Pure function of time t (seconds): zero CSS transitions or cross-frame state
      window.seek = function (t) {
        const clamped = Math.max(0, Math.min(DURATION, Number(t) || 0));
        const enter = spring(clamped - 0.15, 0.84, 14.0);
        const y = (1 - enter) * 48;
        const scale = 0.94 + 0.06 * enter;
        card.style.opacity = Math.max(0, Math.min(1, enter * 1.4)).toFixed(4);
        card.style.transform = "translate3d(0," + y.toFixed(2) + "px,0) scale(" + scale.toFixed(4) + ")";
        counter.textContent = (clamped * 4.25).toFixed(1) + "%";
        return true;
      };

      window.seek(0);

      // Browser preview controls
      let playing = false, startWall = 0, baseT = 0;
      const range = document.getElementById("range");
      const label = document.getElementById("time-label");
      const btn = document.getElementById("play-btn");
      range.addEventListener("input", () => {
        playing = false;
        btn.textContent = "Play";
        baseT = Number(range.value);
        label.textContent = baseT.toFixed(2) + "s";
        window.seek(baseT);
      });
      btn.addEventListener("click", () => {
        playing = !playing;
        btn.textContent = playing ? "Pause" : "Play";
        startWall = performance.now();
        if (playing) requestAnimationFrame(tick);
      });
      function tick(now) {
        if (!playing) return;
        const cur = (baseT + (now - startWall) / 1000) % DURATION;
        range.value = cur;
        label.textContent = cur.toFixed(2) + "s";
        window.seek(cur);
        requestAnimationFrame(tick);
      }
    })();
  </script>
</body>
</html>
